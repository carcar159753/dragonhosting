<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon AntiCheat Panel</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  </head>
  <body>
    <main class="layout">
      <section class="card auth" id="authCard">
        <h1>Dragon Guard</h1>
        <p>Nexus-style anti-cheat panel</p>
        <form id="loginForm">
          <input type="email" id="email" placeholder="E-mail" required />
          <input type="password" id="password" placeholder="Senha" required />
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section class="panel hidden" id="panelRoot">
        <header class="toolbar card">
          <div>
            <h2>Dashboard</h2>
            <p id="onlineCounter">Players online: 0</p>
          </div>
          <button id="refreshBtn">Atualizar</button>
        </header>

        <section class="grid">
          <article class="card map-card">
            <h3>Mapa em tempo real</h3>
            <canvas id="mapCanvas" width="900" height="500"></canvas>
          </article>

          <article class="card">
            <h3>Logs</h3>
            <ul id="logList" class="list"></ul>
          </article>

          <article class="card">
            <h3>Replay</h3>
            <select id="replayPlayer"></select>
            <button id="playReplay">Executar replay</button>
          </article>

          <article class="card">
            <h3>Ações</h3>
            <form id="actionForm">
              <select id="actionType">
                <option value="kick">Kick</option>
                <option value="ban">Ban</option>
              </select>
              <input id="actionLicense" placeholder="license:xxxxx" required />
              <input id="actionReason" placeholder="Motivo" required />
              <button type="submit">Executar</button>
            </form>
          </article>

          <article class="card">
            <h3>Denúncia</h3>
            <form id="reportForm">
              <input id="reportLicense" placeholder="License" required />
              <input id="reportTitle" placeholder="Título" required />
              <textarea id="reportDescription" placeholder="Descrição" required></textarea>
              <button type="submit">Enviar</button>
            </form>
          </article>
        </section>
      </section>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
